<!doctype html>
<!--
  Public prediction dashboard. Static page: reads data.json (written by
  ../build.py from Fatebook) and draws a calibration chart plus a searchable
  list. No server and no secrets; everything here is meant to be public.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eli Tyre's predictions</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
    --series: #2a78d6; --good: #0ca30c; --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
      --series: #3987e5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  h2 { font-size: 18px; margin: 0 0 4px; }
  a { color: inherit; }
  .sub { color: var(--ink-2); margin: 0; font-size: 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; margin-top: 24px; }
  .chart { position: relative; margin-top: 12px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { font-size: 12px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .chart .axis-title { fill: var(--ink-2); }
  .tip { position: absolute; pointer-events: none; background: var(--surface); color: var(--ink);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12); white-space: nowrap; transform: translate(-50%, -100%);
    margin-top: -14px; }
  .tip b { display: block; }
  .tip span { color: var(--ink-2); }
  .toggle { display: inline-flex; margin: 14px 0 8px; border: 1px solid var(--axis); border-radius: 8px; overflow: hidden; }
  .toggle button { font: inherit; font-size: 14px; color: var(--ink-2); background: transparent; border: 0;
    padding: 8px 14px; cursor: pointer; }
  .toggle button + button { border-left: 1px solid var(--axis); }
  .toggle button[aria-pressed="true"] { background: var(--series); color: #fff; font-weight: 600; }
  .toggle button:focus-visible { outline: 2px solid var(--ink); outline-offset: -3px; }
  .legend { display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin-top: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  details { margin-top: 12px; font-size: 14px; color: var(--ink-2); }
  summary { cursor: pointer; }
  table { border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 4px 12px 4px 0; }
  th { font-weight: 600; color: var(--ink-2); }
  .search { display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .search input { flex: 1 1 240px; font: inherit; color: var(--ink); background: var(--page);
    border: 1px solid var(--axis); border-radius: 8px; padding: 10px 12px; min-width: 0; }
  .search input:focus { outline: 2px solid var(--series); outline-offset: 1px; }
  .count { color: var(--ink-2); font-size: 14px; font-variant-numeric: tabular-nums; }
  ul.list { list-style: none; margin: 8px 0 0; padding: 0; }
  ul.list li { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 14px 0;
    border-top: 1px solid var(--grid); }
  ul.list li:first-child { border-top: 0; }
  .pct { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .title { text-decoration: none; overflow-wrap: anywhere; }
  .title:hover { text-decoration: underline; }
  .meta { color: var(--ink-2); font-size: 13px; margin-top: 4px; }
  .meta .icon { font-weight: 700; margin-right: 3px; }
  .yes .icon { color: var(--good); } .no .icon { color: var(--critical); }
  .empty { color: var(--ink-2); padding: 24px 0 8px; }
  footer { color: var(--muted); font-size: 13px; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <h1>Eli Tyre's predictions</h1>
  <p class="sub" id="summary">Loading…</p>

  <section class="card">
    <h2>Calibration</h2>
    <p class="sub">Of the times I gave a probability near each level, how often the answer turned out to be yes. Dots on the dashed line are perfectly calibrated.</p>
    <div class="toggle" role="group" aria-label="Which predictions the chart covers">
      <button type="button" data-mode="public">Public predictions</button>
      <button type="button" data-mode="all">All predictions</button>
    </div>
    <p class="sub" id="calNote"></p>
    <div class="legend" aria-hidden="true">
      <span><svg width="26" height="10"><line x1="0" y1="5" x2="26" y2="5" stroke="var(--series)" stroke-width="2"/><circle cx="13" cy="5" r="4" fill="var(--series)"/></svg>My forecasts</span>
      <span><svg width="26" height="10"><line x1="0" y1="5" x2="26" y2="5" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 5"/></svg>Perfect calibration</span>
    </div>
    <div class="chart" id="chart"></div>
    <details>
      <summary>Show as a table</summary>
      <table id="calTable"></table>
    </details>
  </section>

  <section class="card">
    <h2>Predictions</h2>
    <div class="search">
      <input id="q" type="search" placeholder="Search predictions by keyword" aria-label="Search predictions by keyword" autocomplete="off">
      <span class="count" id="count"></span>
    </div>
    <ul class="list" id="list"></ul>
  </section>

  <footer id="footer"></footer>
</main>

<script>
const DRAFT_KEY = "prediction-dashboard:search";
const MODE_KEY = "prediction-dashboard:calibration-mode";
const $ = id => document.getElementById(id);
const pct = p => Math.round(p * 100) + "%";
const day = iso => new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
const svgEl = (name, attrs, text) => {
  const e = document.createElementNS("http://www.w3.org/2000/svg", name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
};

// Restore the search text before anything is drawn, so it never flashes empty.
const input = $("q");
try { input.value = localStorage.getItem(DRAFT_KEY) || ""; } catch (e) {}

function drawChart(rawBins) {
  // build.py supplies counts per bucket; turn the yes count into a share.
  const bins = rawBins.map(b => ({ ...b, yesCount: b.yes, yes: b.n ? b.yes / b.n : null }));
  // Drawn at the container's real width so labels stay 12px on a phone
  // instead of shrinking with a scaled-down picture.
  const W = Math.max(280, Math.min(720, $("chart").clientWidth || 560)), H = Math.round(Math.max(260, W * 0.68));
  const m = { l: 52, r: 16, t: 12, b: 44 };
  const x = v => m.l + v * (W - m.l - m.r), y = v => H - m.b - v * (H - m.t - m.b);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": "Calibration chart: forecast probability against how often the answer was yes. Values are in the table below." });
  for (let i = 0; i <= 5; i++) {
    const v = i / 5;
    svg.append(svgEl("line", { x1: x(0), x2: x(1), y1: y(v), y2: y(v), stroke: i ? "var(--grid)" : "var(--axis)", "stroke-width": 1 }));
    svg.append(svgEl("text", { x: x(0) - 8, y: y(v) + 4, "text-anchor": "end" }, pct(v)));
    svg.append(svgEl("text", { x: x(v), y: y(0) + 18, "text-anchor": "middle" }, pct(v)));
  }
  svg.append(svgEl("text", { x: x(0.5), y: H - 4, "text-anchor": "middle", class: "axis-title" }, "My forecast"));
  svg.append(svgEl("text", { x: 12, y: y(0.5), "text-anchor": "middle", class: "axis-title", transform: `rotate(-90 12 ${y(0.5)})` }, "Resolved yes"));
  svg.append(svgEl("line", { x1: x(0), y1: y(0), x2: x(1), y2: y(1), stroke: "var(--muted)", "stroke-width": 1.5, "stroke-dasharray": "5 5" }));

  const pts = bins.filter(b => b.n);
  if (pts.length > 1) svg.append(svgEl("polyline", { points: pts.map(b => `${x(b.mean)},${y(b.yes)}`).join(" "),
    fill: "none", stroke: "var(--series)", "stroke-width": 2, "stroke-linejoin": "round" }));
  const tip = document.createElement("div");
  tip.className = "tip"; tip.hidden = true;
  for (const b of pts) {
    const cx = x(b.mean), cy = y(b.yes);
    const dot = svgEl("circle", { cx, cy, r: 5, fill: "var(--series)", stroke: "var(--surface)", "stroke-width": 2 });
    // Invisible target far larger than the dot, so it is easy to hover or tap.
    const hit = svgEl("circle", { cx, cy, r: 18, fill: "transparent", tabindex: 0, role: "img",
      "aria-label": `Forecasts from ${b.lo}% to ${b.hi}%: ${b.yesCount} of ${b.n} resolved yes (${pct(b.yes)})` });
    const show = () => {
      tip.replaceChildren();
      const head = document.createElement("b"); head.textContent = `${pct(b.yes)} resolved yes`;
      const sub = document.createElement("span");
      sub.textContent = `${b.yesCount} of ${b.n} forecast${b.n === 1 ? "" : "s"} between ${b.lo}% and ${b.hi}%`;
      tip.append(head, sub);
      tip.style.left = (cx / W * 100) + "%"; tip.style.top = (cy / H * 100) + "%";
      tip.hidden = false; dot.setAttribute("r", 7);
    };
    const hide = () => { tip.hidden = true; dot.setAttribute("r", 5); };
    hit.addEventListener("pointerenter", show); hit.addEventListener("pointerleave", hide);
    hit.addEventListener("focus", show); hit.addEventListener("blur", hide);
    svg.append(dot, hit);
  }
  $("chart").replaceChildren(svg, tip);

  const table = $("calTable");
  table.replaceChildren();
  const head = table.insertRow();
  ["Forecast range", "Forecasts", "Resolved yes", "Share yes"].forEach(h => { const th = document.createElement("th"); th.textContent = h; head.append(th); });
  for (const b of bins) {
    const r = table.insertRow();
    [`${b.lo}–${b.hi}%`, b.n, b.n ? b.yesCount : "–", b.n ? pct(b.yes) : "–"].forEach(v => r.insertCell().textContent = v);
  }
}

const STATUS = {
  YES: ["yes", "✓", "Resolved yes"], NO: ["no", "✕", "Resolved no"], AMBIGUOUS: ["amb", "?", "Resolved ambiguous"],
};

function row(q) {
  const li = document.createElement("li");
  const last = q.forecasts[q.forecasts.length - 1];
  const p = document.createElement("div"); p.className = "pct"; p.textContent = pct(last.p);
  p.title = "My latest forecast";
  const body = document.createElement("div");
  const a = document.createElement("a"); a.className = "title"; a.href = q.url; a.textContent = q.title; a.rel = "noopener";
  const meta = document.createElement("div"); meta.className = "meta";
  const st = STATUS[q.resolution];
  if (st) {
    meta.classList.add(st[0]);
    const icon = document.createElement("span"); icon.className = "icon"; icon.textContent = st[1]; icon.setAttribute("aria-hidden", "true");
    meta.append(icon, `${st[2]} · ${day(q.resolvedAt || q.resolveBy)}`);
  } else {
    meta.append(`Open · resolves ${day(q.resolveBy)}`);
  }
  if (q.forecasts.length > 1) meta.append(` · my forecasts: ${q.forecasts.map(f => pct(f.p)).join(" → ")}`);
  body.append(a, meta);
  li.append(p, body);
  return li;
}

function render(questions) {
  // Every word typed must appear in the title; order and case do not matter.
  const words = input.value.toLowerCase().split(/\s+/).filter(Boolean);
  const shown = questions.filter(q => { const t = q.title.toLowerCase(); return words.every(w => t.includes(w)); });
  $("list").replaceChildren(...shown.map(row));
  if (!shown.length) {
    const li = document.createElement("li"); li.className = "empty"; li.style.display = "block";
    li.textContent = "No predictions match that search.";
    $("list").append(li);
  }
  $("count").textContent = words.length ? `${shown.length} of ${questions.length} predictions` : `${questions.length} predictions`;
}

fetch("data.json", { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(data => {
  const qs = data.questions;
  const scored = qs.filter(q => q.resolution === "YES" || q.resolution === "NO").length;
  $("summary").textContent = `${qs.length} public predictions from Fatebook, ${scored} of them resolved yes or no.`;
  $("footer").textContent = `Data from fatebook.io · last changed ${day(data.updated)}`;
  let mode = "public";
  try { if (localStorage.getItem(MODE_KEY) === "all") mode = "all"; } catch (e) {}
  const buttons = document.querySelectorAll(".toggle button");
  const showMode = () => {
    const bins = data.calibration[mode], n = bins.reduce((s, b) => s + b.n, 0);
    buttons.forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
    $("calNote").textContent = mode === "all"
      ? `${n} forecasts on every question I have resolved yes or no, including private ones. Only these totals are published for private questions.`
      : `${n} forecasts on the public predictions listed below that resolved yes or no.`;
    drawChart(bins);
  };
  buttons.forEach(b => b.addEventListener("click", () => {
    mode = b.dataset.mode;
    try { localStorage.setItem(MODE_KEY, mode); } catch (e) {}
    showMode();
  }));
  showMode();
  let lastWidth = $("chart").clientWidth;
  window.addEventListener("resize", () => {
    if ($("chart").clientWidth !== lastWidth) { lastWidth = $("chart").clientWidth; showMode(); }
  });
  render(qs);
  input.addEventListener("input", () => {
    try { localStorage.setItem(DRAFT_KEY, input.value); } catch (e) {}
    render(qs);
  });
}).catch(err => {
  $("summary").textContent = "Could not load the predictions. Please try again later.";
  console.error("data.json failed to load", err);
});
</script>
</body>
</html>
