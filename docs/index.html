<!doctype html>
<!--
  Public prediction dashboard. Static page: reads data.json (written by
  ../build.py from Fatebook) and draws a calibration chart plus a searchable
  list. No server and no secrets; everything here is meant to be public.

  The look is a cousin of fatebook.io, not a copy: the same layout (question
  cards with the forecast top right, a resolution pill, a dots-only
  calibration chart) but its own teal accent, system font, warm page colour,
  tinted pills and a coloured left edge on resolved cards. Light-only.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eli Tyre's predictions</title>
<style>
  :root {
    color-scheme: light;
    --page: #f7f6f3; --white: #fff; --text: #374151; --heading: #111827;
    --n200: #e5e5e5; --n300: #d4d4d4; --n400: #a3a3a3; --n500: #737373; --n600: #525252; --n700: #404040;
    --accent300: #5eead4; --accent500: #14b8a6; --accent600: #0f766e; --accent700: #115e59; --accent800: #134e4a;
    --green: #16a34a; --red: #dc2626; --blue: #2563eb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 30px; line-height: 1.2; font-weight: 700; color: var(--heading); margin: 0 0 40px; letter-spacing: -0.01em; }
  main { max-width: 682px; margin: 0 auto; padding: 48px 16px 64px; }
  h2 { font-size: 24px; line-height: 1.33; font-weight: 700; color: var(--heading); margin: 0 0 16px; }
  h3 { font-size: 20px; line-height: 1.6; font-weight: 600; color: var(--heading); margin: 0; }
  a { color: inherit; }
  .desc { font-size: 14px; color: var(--n500); margin: 0 0 16px; }
  section + section { margin-top: 56px; }

  .button { display: inline-flex; align-items: center; padding: 6px 16px; border: 1px solid transparent;
    font: inherit; font-size: 14px; font-weight: 500; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    background: var(--n200); color: var(--n700); cursor: pointer; user-select: none; }
  .button:hover { background: var(--n300); }
  .button[aria-pressed="true"] { background: var(--accent600); color: #fff; }
  .button[aria-pressed="true"]:hover { background: var(--accent700); }
  .button:focus-visible, .card a:focus-visible { outline: 2px solid var(--accent500); outline-offset: 2px; }
  .toggle { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }

  .chart { position: relative; margin-top: 8px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { font-size: 12px; fill: #666; }
  .chart .axis-title { fill: gray; }
  .legend { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; font-size: 12px; color: #666; margin-top: 16px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .tip { position: absolute; pointer-events: none; background: rgba(0,0,0,0.8); color: #fff; border-radius: 6px;
    padding: 6px 8px; font-size: 12px; line-height: 1.4; white-space: nowrap; transform: translate(-50%, -100%); margin-top: -10px; }
  details { margin-top: 12px; font-size: 14px; color: var(--n500); }
  summary { cursor: pointer; }
  table { border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 4px 16px 4px 0; }
  th { font-weight: 600; color: var(--n600); }

  .listhead { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding-bottom: 16px; }
  .count { font-size: 14px; color: var(--n500); font-variant-numeric: tabular-nums; }
  input[type="search"] { width: 100%; font: inherit; font-size: 16px; color: var(--heading); background: var(--white);
    border: 1px solid var(--n300); border-radius: 6px; padding: 10px 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); margin-bottom: 12px; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .tag { font: inherit; font-size: 13px; font-weight: 500; line-height: 1.4; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--n200); background: var(--white); color: var(--n600); cursor: pointer; }
  .tag:hover { background: #f5f5f5; }
  .tag small { font-size: 12px; color: var(--n400); margin-left: 4px; font-weight: 400; }
  .tag[aria-pressed="true"] { background: var(--accent600); border-color: var(--accent600); color: #fff; }
  .tag[aria-pressed="true"] small { color: #ccfbf1; }
  .tag:focus-visible { outline: 2px solid var(--accent500); outline-offset: 2px; }
  .cardtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .cardtags span { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: #f5f5f5; color: var(--n500); }
  input[type="search"]:focus { outline: none; border-color: var(--accent500); box-shadow: 0 0 0 1px var(--accent500); }
  input[type="search"]::placeholder { color: var(--n400); }

  .list { display: grid; gap: 24px; list-style: none; margin: 0; padding: 0; }
  .card { background: var(--white); outline: 1px solid var(--n200); border-radius: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    padding: 16px; display: grid; gap: 12px; transition: transform .15s, box-shadow .15s; }
  .card:hover { transform: scale(1.01); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1); }
  .card.resolved { border-left: 4px solid var(--edge); padding-left: 12px; }
  .card.yes { --edge: var(--green); } .card.no { --edge: var(--red); } .card.amb { --edge: var(--blue); }
  .top { display: flex; gap: 16px; justify-content: space-between; align-items: flex-start; }
  .title { font-weight: 600; color: var(--heading); text-decoration: none; overflow-wrap: anywhere; }
  .title:hover { text-decoration: underline; }
  .pct { position: relative; flex: none; font-size: 20px; line-height: 1.4; font-weight: 700; padding: 2px 8px; border-radius: 6px;
    min-width: 76px; text-align: right; color: var(--n600); overflow: hidden; }
  .pct.open { color: var(--accent800); box-shadow: inset 0 0 0 2px var(--n300); }
  .pct .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent600); opacity: .2; }
  .pct span { position: relative; }
  .bottom { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; align-items: center; font-size: 14px; }
  .when { color: var(--n400); text-align: center; text-wrap: balance; }
  .when.ready { color: var(--accent300); }
  .when b { font-weight: 600; }
  .pill { justify-self: end; width: 100%; max-width: 160px; text-align: center; border-radius: 999px; padding: 5px 16px;
    font-weight: 600; }
  .yes .pill { background: #dcfce7; color: #166534; } .no .pill { background: #fee2e2; color: #991b1b; } .amb .pill { background: #dbeafe; color: #1e40af; }
  .history { font-size: 14px; color: var(--n400); }
  .empty { font-style: italic; color: var(--n500); font-size: 14px; text-align: center; margin-top: 16px; }
  footer { color: var(--n400); font-size: 14px; margin-top: 48px; text-align: center; }
  @media (max-width: 480px) { .bottom { grid-template-columns: 1fr 1fr; } .who { display: none; } .when { text-align: left; } }
</style>
</head>
<body>
<main>
  <h1>Eli Tyre's predictions</h1>
  <section>
    <h2>Calibration</h2>
    <p class="desc">Of the times I gave a probability near each level, how often the answer turned out to be yes. Dots on the diagonal line are perfectly calibrated.</p>
    <div class="toggle" role="group" aria-label="Which predictions the chart covers">
      <button type="button" class="button" data-mode="public">Public predictions</button>
      <button type="button" class="button" data-mode="all">All predictions</button>
    </div>
    <p class="desc" id="calNote"></p>
    <div class="legend" aria-hidden="true">
      <span><i style="background:#0f766ecc"></i>My calibration</span>
      <span><i style="background:#a3a3a3;height:2px;width:18px;border-radius:0"></i>Perfect calibration</span>
    </div>
    <div class="chart" id="chart"></div>
    <details>
      <summary>Show as a table</summary>
      <table id="calTable"></table>
    </details>
  </section>

  <section>
    <div class="listhead">
      <h3>My public forecasts</h3>
      <span class="count" id="count"></span>
    </div>
    <input id="q" type="search" placeholder="Search predictions by keyword" aria-label="Search predictions by keyword" autocomplete="off">
    <div class="tags" id="tags" role="group" aria-label="Filter by tag"></div>
    <ul class="list" id="list"></ul>
  </section>

  <footer id="footer"></footer>
</main>

<script>
const DRAFT_KEY = "prediction-dashboard:search";
const MODE_KEY = "prediction-dashboard:calibration-mode";
const TAGS_KEY = "prediction-dashboard:tags";
let picked = new Set();
try { picked = new Set(JSON.parse(localStorage.getItem(TAGS_KEY) || "[]")); } catch (e) {}
const $ = id => document.getElementById(id);
const pct = p => Math.round(p * 100) + "%";
const day = iso => new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const svgEl = (name, attrs, text) => {
  const e = document.createElementNS("http://www.w3.org/2000/svg", name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
};

// Restore the search text before anything is drawn, so it never flashes empty.
const input = $("q");
try { input.value = localStorage.getItem(DRAFT_KEY) || ""; } catch (e) {}

function drawChart(rawBins) {
  // build.py supplies counts per bucket; turn the yes count into a share.
  const bins = rawBins.map(b => ({ ...b, yesCount: b.yes, yes: b.n ? b.yes / b.n : null }));
  // Drawn at the container's real width so labels stay 12px on a phone
  // instead of shrinking with a scaled-down picture.
  const W = Math.max(280, Math.min(650, $("chart").clientWidth || 560)), H = Math.round(Math.max(300, W * 0.82));
  const m = { l: 62, r: 14, t: 12, b: 48 };
  const x = v => m.l + v * (W - m.l - m.r), y = v => H - m.b - v * (H - m.t - m.b);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": "Calibration chart: forecast probability against how often the answer was yes. Values are in the table below." });
  const step = W < 420 ? 2 : 1;   // label every 20% when there is no room for every 10%
  for (let i = 0; i <= 10; i++) {
    const v = i / 10;
    svg.append(svgEl("line", { x1: x(0), x2: x(1), y1: y(v), y2: y(v), stroke: "rgba(0,0,0,0.1)", "stroke-width": 1 }));
    svg.append(svgEl("line", { x1: x(v), x2: x(v), y1: y(0), y2: y(1), stroke: "rgba(0,0,0,0.1)", "stroke-width": 1 }));
    svg.append(svgEl("text", { x: x(0) - 8, y: y(v) + 4, "text-anchor": "end" }, pct(v)));
    if (i % step === 0) svg.append(svgEl("text", { x: x(v), y: y(0) + 18, "text-anchor": "middle" }, pct(v)));
  }
  svg.append(svgEl("text", { x: x(0.5), y: H - 6, "text-anchor": "middle", class: "axis-title" }, "My forecast"));
  svg.append(svgEl("text", { x: 12, y: y(0.5), "text-anchor": "middle", class: "axis-title", transform: `rotate(-90 12 ${y(0.5)})` }, "% of questions that resolved Yes"));
  svg.append(svgEl("line", { x1: x(0), y1: y(0), x2: x(1), y2: y(1), stroke: "#a3a3a3", "stroke-width": 1.5 }));

  // Dots only, as on Fatebook: buckets are separate estimates, so nothing joins them.
  const tip = el("div", "tip"); tip.hidden = true;
  for (const b of bins.filter(b => b.n)) {
    const cx = x(b.mean), cy = y(b.yes);
    const dot = svgEl("circle", { cx, cy, r: 5, fill: "#0f766ecc" });
    // Invisible target far larger than the dot, so it is easy to hover or tap.
    const hit = svgEl("circle", { cx, cy, r: 16, fill: "transparent", tabindex: 0, role: "img",
      "aria-label": `Forecasts from ${b.lo}% to ${b.hi}%: ${b.yesCount} of ${b.n} resolved yes (${pct(b.yes)})` });
    const show = () => {
      tip.replaceChildren(el("div", "", `n=${b.n}`), el("div", "", `${(b.mean * 100).toFixed(1)}% pred`), el("div", "", `${(b.yes * 100).toFixed(1)}% outcome`));
      tip.style.left = (cx / W * 100) + "%"; tip.style.top = (cy / H * 100) + "%";
      tip.hidden = false; dot.setAttribute("r", 7);
    };
    const hide = () => { tip.hidden = true; dot.setAttribute("r", 5); };
    hit.addEventListener("pointerenter", show); hit.addEventListener("pointerleave", hide);
    hit.addEventListener("focus", show); hit.addEventListener("blur", hide);
    svg.append(dot, hit);
  }
  $("chart").replaceChildren(svg, tip);

  const table = $("calTable");
  table.replaceChildren();
  const head = table.insertRow();
  ["Forecast range", "Forecasts", "Resolved yes", "Share yes"].forEach(h => head.append(el("th", "", h)));
  for (const b of bins) {
    const r = table.insertRow();
    [`${b.lo}–${b.hi}%`, b.n, b.n ? b.yesCount : "–", b.n ? pct(b.yes) : "–"].forEach(v => r.insertCell().textContent = v);
  }
}

const STATUS = { YES: ["yes", "Yes"], NO: ["no", "No"], AMBIGUOUS: ["amb", "Ambiguous"] };

function row(q) {
  const st = STATUS[q.resolution];
  const li = el("li", "card" + (st ? " resolved " + st[0] : ""));
  const last = q.forecasts[q.forecasts.length - 1];

  const top = el("div", "top");
  const a = el("a", "title", q.title); a.href = q.url; a.rel = "noopener";
  const p = el("div", "pct" + (st ? "" : " open")); p.title = "My latest forecast";
  if (!st) { const fill = el("div", "fill"); fill.style.width = Math.round(last.p * 100) + "%"; p.append(fill); }
  p.append(el("span", "", pct(last.p)));
  top.append(a, p);

  const bottom = el("div", "bottom");
  bottom.append(el("span", "who", "Eli Tyre"));
  const due = !st && new Date(q.resolveBy) < new Date();
  const when = el("span", "when" + (due ? " ready" : ""));
  when.append(due ? el("b", "", "Ready to resolve") : (st ? "Resolved" : "Resolves"), el("br"), day(st ? (q.resolvedAt || q.resolveBy) : q.resolveBy));
  bottom.append(when);
  if (st) bottom.append(el("span", "pill", st[1]));

  li.append(top, bottom);
  if (q.tags.length) { const t = el("div", "cardtags"); q.tags.forEach(n => t.append(el("span", "", n))); li.append(t); }
  if (q.forecasts.length > 1) li.append(el("div", "history", "My forecasts: " + q.forecasts.map(f => pct(f.p)).join(" → ")));
  return li;
}

function render(questions) {
  // Every word typed must appear in the title; order and case do not matter.
  const words = input.value.toLowerCase().split(/\s+/).filter(Boolean);
  // With tags picked, a prediction needs at least one of them (as Fatebook's own tag filter works).
  const shown = questions.filter(q => { const t = q.title.toLowerCase();
    return words.every(w => t.includes(w)) && (!picked.size || q.tags.some(n => picked.has(n))); });
  $("list").replaceChildren(...shown.map(row));
  if (!shown.length) $("list").append(el("li", "empty", "No predictions match that search and tag selection."));
  $("count").textContent = (words.length || picked.size) ? `${shown.length} of ${questions.length} predictions` : `${questions.length} predictions`;
}

fetch("data.json", { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(data => {
  const qs = data.questions;
  $("footer").textContent = `Data from fatebook.io · last changed ${day(data.updated)}`;

  let mode = "public";
  try { if (localStorage.getItem(MODE_KEY) === "all") mode = "all"; } catch (e) {}
  const buttons = document.querySelectorAll(".toggle button");
  const showMode = () => {
    const bins = data.calibration[mode], n = bins.reduce((s, b) => s + b.n, 0);
    buttons.forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
    $("calNote").textContent = mode === "all"
      ? `${n} forecasts on every question I have resolved yes or no, including private ones. Only these totals are published for private questions.`
      : `${n} forecasts on the public predictions listed below that resolved yes or no.`;
    drawChart(bins);
  };
  buttons.forEach(b => b.addEventListener("click", () => {
    mode = b.dataset.mode;
    try { localStorage.setItem(MODE_KEY, mode); } catch (e) {}
    showMode();
  }));
  showMode();
  let lastWidth = $("chart").clientWidth;
  window.addEventListener("resize", () => {
    if ($("chart").clientWidth !== lastWidth) { lastWidth = $("chart").clientWidth; showMode(); }
  });

  // Tag buttons, most used first. Tags that no longer exist are dropped from a saved selection.
  const counts = {};
  qs.forEach(q => q.tags.forEach(n => counts[n] = (counts[n] || 0) + 1));
  picked = new Set([...picked].filter(n => counts[n]));
  Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b)).forEach(n => {
    const b = el("button", "tag", n); b.type = "button"; b.append(el("small", "", counts[n]));
    b.setAttribute("aria-pressed", picked.has(n));
    b.addEventListener("click", () => {
      picked.has(n) ? picked.delete(n) : picked.add(n);
      b.setAttribute("aria-pressed", picked.has(n));
      try { localStorage.setItem(TAGS_KEY, JSON.stringify([...picked])); } catch (e) {}
      render(qs);
    });
    $("tags").append(b);
  });

  render(qs);
  input.addEventListener("input", () => {
    try { localStorage.setItem(DRAFT_KEY, input.value); } catch (e) {}
    render(qs);
  });
}).catch(err => {
  $("calNote").textContent = "Could not load the predictions. Please try again later.";
  console.error("data.json failed to load", err);
});
</script>
</body>
</html>
